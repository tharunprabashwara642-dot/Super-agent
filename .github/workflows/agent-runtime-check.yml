name: Agent Runtime Checks

on:
  push:
    branches: ["main", "agent-runtime-v3-refactor"]
  pull_request:
    branches: ["main"]

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run check
      - run: npm run test:runtime
